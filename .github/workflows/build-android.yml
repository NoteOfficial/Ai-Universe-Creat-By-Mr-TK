name: Build AI UNIVERSE APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed v1+v2+v3 APK & Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug & release keystores
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            # Free zero-secret personal release signing keystore
            keytool -genkey -v -keystore my-upload-key.jks -storepass aiuniverse1201 -alias upload -keypass aiuniverse1201 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mr TK,O=TK Official,C=BD"
            echo "STORE_PASSWORD=aiuniverse1201" >> $GITHUB_ENV
            echo "KEY_PASSWORD=aiuniverse1201" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Obfuscated Release APK & AAB
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Sign Release APK with v1 + v2 + v3 & Verify
        run: |
          mkdir -p dist
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          "$APKSIGNER" sign \
            --ks my-upload-key.jks \
            --ks-key-alias upload \
            --ks-pass "env:STORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out dist/AI_UNIVERSE_v1201.apk \
            app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --min-sdk-version 21 --print-certs -v dist/AI_UNIVERSE_v1201.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/AI_UNIVERSE_v1201.aab

      - name: Upload AI UNIVERSE v1201 APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: AI_UNIVERSE_v1201_Builds
          path: |
            dist/AI_UNIVERSE_v1201.apk
            dist/AI_UNIVERSE_v1201.aab
          retention-days: 30
