name: Build AI UNIVERSE APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed v1+v2+v3 APK & Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK & Required Packages
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36.1 platforms;android-36 build-tools;36.0.0'

      - name: Normalize SDK Environment & Verify Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "platform-tools" "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare Debug & Release Keystores
        run: |
          rm -f debug.keystore my-upload-key.jks
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.STORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            # Free zero-secret personal release signing keystore
            keytool -genkeypair -v -keystore my-upload-key.jks -storepass aiuniverse1201 -alias upload -keypass aiuniverse1201 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mr TK,O=TK Official,C=BD"
            echo "STORE_PASSWORD=aiuniverse1201" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=aiuniverse1201" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Run Unit Tests
        run: |
          gradle :app:testDebugUnitTest \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            --max-workers=2 --stacktrace

      - name: Build Obfuscated Release APK & AAB
        run: |
          gradle :app:assembleRelease :app:bundleRelease \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            --max-workers=2 --stacktrace

      - name: Sign Release APK with v1 + v2 + v3 & Verify
        run: |
          mkdir -p dist
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR=$(ls -d "$SDK_DIR"/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          "$APKSIGNER" sign \
            --ks my-upload-key.jks \
            --ks-key-alias upload \
            --ks-pass "env:STORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out dist/AI_UNIVERSE_v1201.apk \
            app/build/outputs/apk/release/app-release.apk

          "$APKSIGNER" verify --min-sdk-version 21 --print-certs -v dist/AI_UNIVERSE_v1201.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/AI_UNIVERSE_v1201.aab
          ls -lh dist/

      - name: Upload AI UNIVERSE v1201 APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: AI_UNIVERSE_v1201_Builds
          path: |
            dist/AI_UNIVERSE_v1201.apk
            dist/AI_UNIVERSE_v1201.aab
          retention-days: 30
